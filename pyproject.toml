[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cardpol"
version = "0.1.0"
description = "Action-free representation learning from multi-policy video (CardPol) on distracting DMC"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "torch==2.5.1",  # CUDA 12.1 build, see [tool.uv.sources]
    "numpy",
    "h5py",
    "mujoco==3.4.0",
    "dm_control==1.0.34",
    "dm-env",
    "opencv-python-headless",
    "pillow",
]

[project.optional-dependencies]
wandb = ["wandb"]

[tool.setuptools.packages.find]
where = ["src"]

# uv installs torch from the CUDA 12.1 index (runs on drivers >= 525). With pip, use
#   pip install -e . --extra-index-url https://download.pytorch.org/whl/cu121
[tool.uv.sources]
torch = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
